<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thinkit — 회차 보기</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="content-room.css">
<link rel="stylesheet" href="content-detail.css">
</head>
<body>
<div class="cr-app">

  <header class="cr-topbar">
    <a class="cr-back-home" href="create.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9a1 1 0 001 1h10a1 1 0 001-1v-9"/><path d="M10 20v-6h4v6"/></svg>
      Thinkit
    </a>
    <a class="cr-logo" href="consume.html">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="10 8 16 12 10 16 10 8"/><circle cx="12" cy="12" r="9"/></svg></span>
      <span class="name">CONTENT ROOM</span>
    </a>
    <label class="cr-search" style="margin-left:auto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="crHeaderSearchInput" placeholder="제목, 세계관 검색">
    </label>
    <button class="cr-profile" aria-label="프로필">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13" r="6" fill="#fff"/><circle cx="7" cy="7.5" r="2.4" fill="#fff"/><circle cx="17" cy="7.5" r="2.4" fill="#fff"/></svg>
    </button>
  </header>

  <main class="cd-main" id="cdMain">

    <div class="cd-player" id="player">
      <span class="cr-tier-badge rising" id="cdPlayerBadge">RISING</span>
      <div class="cd-player-center" id="cdPlayerCenter"><span class="btn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span></div>
    </div>

    <div class="cd-grid">
      <div class="cd-main-col">
        <div class="cd-title-row">
          <h1 id="cdEpTitle">회차를 불러오는 중이에요</h1>
        </div>
        <a class="cd-ip-link" href="#" id="cdIpLink">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 010 18 15 15 0 010-18z"/></svg>
          <span id="cdIpLinkLabel">세계관 보기</span>
        </a>

        <div class="cd-stats-row">
          <span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.5-9.5-9C.6 8.5 3 4.5 7 4.5c2.1 0 3.7 1.2 5 3 1.3-1.8 2.9-3 5-3 4 0 6.4 4 4.5 7.5C19 16.5 12 21 12 21z"/></svg>좋아요 <span id="likeCount">0</span></span>
          <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 01-8.9 8.4 8.6 8.6 0 01-3.8-.9L3 20l1.1-5A8.4 8.4 0 1121 11.5z"/></svg>댓글 <span id="commentCountInline">0</span></span>
          <span id="cdPublishedAt"></span>
        </div>

        <div class="cd-actions">
          <button class="cd-action-btn" id="likeBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-9.5-9C.6 8.5 3 4.5 7 4.5c2.1 0 3.7 1.2 5 3 1.3-1.8 2.9-3 5-3 4 0 6.4 4 4.5 7.5C19 16.5 12 21 12 21z"/></svg>
            좋아요
          </button>
          <button class="cd-action-btn" id="bookmarkBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
            북마크
          </button>
          <button class="cd-action-btn" id="shareBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.6"/><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="19" r="2.6"/><path d="M8.2 10.6l7.6-4.2M8.2 13.4l7.6 4.2"/></svg>
            공유
          </button>
        </div>

        <div class="cd-panel" id="cdBodyPanel" style="display:none">
          <h3>회차 내용</h3>
          <div class="desc" id="cdBodyContent"></div>
        </div>

        <div class="cd-panel">
          <h3>제작자</h3>
          <div class="cd-creator-row">
            <div class="cd-creator-avatar thumb-2" id="cdCreatorAvatar"></div>
            <div class="cd-creator-info"><div class="n" id="cdCreatorName">-</div><div class="r" id="cdCreatorRole">-</div></div>
            <button class="cd-follow-btn" id="cdFollowBtn">팔로우</button>
          </div>
        </div>

        <div class="cd-panel">
          <h3>이 IP의 다른 회차</h3>
          <div class="cd-ep-strip" id="cdEpStrip"></div>
        </div>

        <div class="cd-panel">
          <h3>댓글 <span id="commentCount">0</span></h3>
          <div class="cd-comment-box">
            <span class="av"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="13" r="6" fill="#fff"/><circle cx="7" cy="7.5" r="2.4" fill="#fff"/><circle cx="17" cy="7.5" r="2.4" fill="#fff"/></svg></span>
            <input type="text" id="commentInput" placeholder="댓글을 남겨보세요">
            <button id="commentSubmitBtn">등록</button>
          </div>
          <div id="commentList"></div>
        </div>
      </div>

      <div class="cd-side-col">
        <div class="cd-panel">
          <h3>추천 콘텐츠</h3>
          <div class="cd-related-row disabled">
            <div class="cd-related-thumb cr-thumb-9"></div>
            <div class="cd-related-info"><div class="t">모의 선택 영역</div><div class="m">아직 연결되지 않은 콘텐츠예요</div></div>
          </div>
          <div class="cd-related-row disabled">
            <div class="cd-related-thumb cr-thumb-8"></div>
            <div class="cd-related-info"><div class="t">모의 선택 영역</div><div class="m">아직 연결되지 않은 콘텐츠예요</div></div>
          </div>
          <div class="cd-related-row disabled">
            <div class="cd-related-thumb cr-thumb-1"></div>
            <div class="cd-related-info"><div class="t">모의 선택 영역</div><div class="m">아직 연결되지 않은 콘텐츠예요</div></div>
          </div>
          <div class="cd-related-row disabled">
            <div class="cd-related-thumb cr-thumb-10"></div>
            <div class="cd-related-info"><div class="t">모의 선택 영역</div><div class="m">아직 연결되지 않은 콘텐츠예요</div></div>
          </div>
        </div>
      </div>
    </div>

  </main>
</div>
<script src="script.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="firebase-init.js"></script>
<script src="storage.js"></script>
<script src="auth-ui.js"></script>
<script src="content-detail.js"></script>
</body>
</html>
