<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thinkit(띵킷) — AI-Native IP Platform</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app landing-dark">

  <header class="site-header">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 6h14M12 6v13" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="logo-text">
        <div class="name">Thinkit</div>
        <div class="tagline">AI-NATIVE IP PLATFORM</div>
      </div>
    </div>

    <nav class="main-nav">
      <a href="create.html">DNA ROOM</a>
      <a href="open-dna.html">OPEN DNA</a>
      <a href="crew-match.html">CREW MATCH</a>
    </nav>

    <div class="header-actions">
      <button class="lp-icon-btn bearip-soon" aria-label="검색" data-soon-message="검색 기능은 아직 준비 중이에요">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <button class="dr-profile-chip">
        <span class="uname">로그인</span>
      </button>
      <button class="lp-signup-btn" onclick="if (bearipRequireLogin('create.html')) location.href='create.html'">시작하기</button>
    </div>
  </header>

  <main class="hero">
    <div class="eyebrow">AI · NATIVE · IP · PLATFORM</div>
    <h1 class="lp-wordmark">Think It<span class="bang">!</span></h1>
    <p class="lp-tagline">아이디어가 연결되고, <span class="accent">창의력이 흐르고</span>, 미래가 시작되는 곳.</p>

    <!-- Full scene artwork — people sketching / glowing tree / content
         thumbnails are all one real image now; only the bottom CTA row
         below is clickable, these labels are just captions over the art. -->
    <div class="lp-scene">
      <img class="lp-scene-img" src="assets/hero-tree-bg.png" alt="함께 아이디어를 만들고, 새로운 세계를 상상하는 모습">
      <div class="lp-scene-label left">
        <div class="t">Build It Together</div>
        <div class="s">아이디어를 함께 만들어요</div>
      </div>
      <div class="lp-scene-label right">
        <div class="t">Imagine What's Next</div>
        <div class="s">무한한 영감을 탐험해요</div>
      </div>
    </div>

    <div class="lp-cta-row">
      <button class="lp-cta left" onclick="location.href='create.html'">
        <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></span>
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-4 3-6.5 6.5-6.5s6.5 2.5 6.5 6.5"/><circle cx="17.5" cy="9" r="2.6"/><path d="M15 13.2c2.7.3 4.6 2.4 5.5 4.3"/></svg></span>
        <span class="txt"><span class="t">Build It Together</span><span class="s">아이디어를 함께 만들어요</span></span>
      </button>
      <button class="lp-cta right" onclick="location.href='consume.html'">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"/></svg></span>
        <span class="txt"><span class="t">Imagine What's Next</span><span class="s">무한한 영감을 탐험해요</span></span>
        <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></span>
      </button>
    </div>

  </main>
</div>
<script src="script.js"></script>
<script src="storage.js"></script>
<script src="auth-ui.js"></script>
</body>
</html>
