<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEARIP — AI-Native IP Platform</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <header class="site-header">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="13" r="7" fill="#fff"/>
          <circle cx="5.5" cy="6" r="2.6" fill="#fff"/>
          <circle cx="18.5" cy="6" r="2.6" fill="#fff"/>
          <circle cx="9.3" cy="13.2" r="1" fill="#2a241d"/>
          <circle cx="14.7" cy="13.2" r="1" fill="#2a241d"/>
        </svg>
      </div>
      <div class="logo-text">
        <div class="name">BEARIP</div>
        <div class="tagline">AI-NATIVE IP PLATFORM</div>
      </div>
    </div>

    <nav class="main-nav">
      <a href="create.html">DNA ROOM</a>
      <a href="consume.html">CONTENT ROOM</a>
      <a href="#crew">CREW</a>
    </nav>

    <button class="btn-create-ip" onclick="location.href='create.html'">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"/></svg>
      CREATE IP
    </button>
  </header>

  <main class="hero">
    <div class="eyebrow">AI · NATIVE · IP · PLATFORM</div>
    <h1 class="headline">Every Idea<br>Becomes a World</h1>
    <p class="subline">당신의 아이디어가, 새로운 세계가 되는 곳</p>

    <div class="portal-stage">

      <!-- Left portal: Create -->
      <button class="portal-card left" onclick="location.href='create.html'" aria-label="창작 시작하기">
        <div class="portal-frame">
          <div class="portal-scene purple">
            <div class="stars"></div>
            <svg class="scene-art" viewBox="0 0 400 260" preserveAspectRatio="xMidYMax slice">
              <ellipse cx="200" cy="250" rx="180" ry="14" fill="#0f0625" opacity="0.5"/>
              <path d="M200 60 L206 150 L230 150 L204 170 L214 210 L200 188 L186 210 L196 170 L170 150 L194 150 Z" fill="#e7d9ff" opacity="0.9"/>
              <circle cx="140" cy="90" r="3" fill="#d9b8ff"/>
              <circle cx="255" cy="110" r="4" fill="#d9b8ff"/>
              <circle cx="120" cy="150" r="2.5" fill="#d9b8ff"/>
              <circle cx="270" cy="70" r="2.5" fill="#fff"/>
              <path d="M60 240 Q100 200 150 235 Q200 195 250 232 Q300 200 340 238 L340 260 L60 260 Z" fill="#2a1150" opacity="0.85"/>
            </svg>
          </div>
          <div class="portal-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M6 4c4 2 4 5 0 7s-4 5 0 7"/>
              <path d="M18 4c-4 2-4 5 0 7s4 5 0 7"/>
              <path d="M7.5 7h9M7.5 17h9M6.5 12h11"/>
            </svg>
          </div>
        </div>
        <div class="portal-label">DNA ROOM</div>
        <div class="portal-sub">CREATE · STRUCTURE · DEVELOP IP</div>
        <div class="portal-go">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
        </div>
      </button>

      <!-- Center mascot -->
      <div class="mascot-column">
        <div class="mascot-ring">
          <svg class="bear" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="100" cy="205" rx="55" ry="8" fill="#2a241d" opacity="0.08"/>
            <circle cx="46" cy="48" r="19" fill="#5b4636"/>
            <circle cx="154" cy="48" r="19" fill="#5b4636"/>
            <circle cx="46" cy="48" r="9" fill="#7a6250"/>
            <circle cx="154" cy="48" r="9" fill="#7a6250"/>
            <ellipse cx="55" cy="120" rx="26" ry="34" fill="#5b4636"/>
            <ellipse cx="145" cy="120" rx="26" ry="34" fill="#5b4636"/>
            <rect x="30" y="150" width="24" height="10" rx="5" fill="#e8ceac" transform="rotate(-18 30 150)"/>
            <rect x="146" y="150" width="24" height="10" rx="5" fill="#8a6b45" transform="rotate(18 146 150)"/>
            <rect x="20" y="140" width="12" height="34" rx="6" fill="#e8ceac" transform="rotate(-18 20 140)"/>
            <rect x="168" y="140" width="14" height="30" rx="6" fill="#8a6b45" transform="rotate(20 168 140)"/>
            <ellipse cx="100" cy="120" rx="58" ry="66" fill="#6b5541"/>
            <path d="M55 150 Q100 175 145 150 L150 205 Q100 222 50 205 Z" fill="#f6efe1"/>
            <path d="M78 152 Q100 165 122 152 L120 168 Q100 178 80 168 Z" fill="#5f8c5a"/>
            <circle cx="100" cy="186" r="12" fill="#efe4cf" stroke="#ddcda8" stroke-width="1.5"/>
            <ellipse cx="100" cy="96" rx="34" ry="28" fill="#8a725c"/>
            <circle cx="82" cy="88" r="6.5" fill="#241b12"/>
            <circle cx="118" cy="88" r="6.5" fill="#241b12"/>
            <ellipse cx="100" cy="104" rx="10" ry="7" fill="#3a2c1f"/>
            <path d="M92 116 Q100 121 108 116" stroke="#3a2c1f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="hero-note">창작할까요, 즐길까요?<br>원하는 문을 선택하세요.</div>
      </div>

      <!-- Right portal: Consume -->
      <button class="portal-card right" onclick="location.href='consume.html'" aria-label="콘텐츠 즐기기">
        <div class="portal-frame">
          <div class="portal-scene blue">
            <div class="stars"></div>
            <svg class="scene-art" viewBox="0 0 400 260" preserveAspectRatio="xMidYMax slice">
              <ellipse cx="150" cy="150" rx="70" ry="14" fill="#0a2a4a" opacity="0.5"/>
              <path d="M100 150 Q150 128 200 150 Q150 165 100 150 Z" fill="#dff0ff"/>
              <path d="M120 150 L110 168 L190 168 L180 150 Z" fill="#bcd9ff"/>
              <ellipse cx="300" cy="90" rx="46" ry="9" fill="#0a2a4a" opacity="0.4"/>
              <path d="M270 90 Q300 74 330 90 Q300 100 270 90 Z" fill="#eaf6ff"/>
              <path d="M300 40 Q330 60 316 92 Q300 100 284 92 Q270 60 300 40 Z" fill="#a9c9ff" opacity="0.9"/>
              <circle cx="60" cy="60" r="14" fill="#fdf6e3" opacity="0.9"/>
              <ellipse cx="60" cy="240" rx="180" ry="16" fill="#062038" opacity="0.85"/>
            </svg>
          </div>
          <div class="portal-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="10 8 16 12 10 16 10 8"/>
              <circle cx="12" cy="12" r="9"/>
            </svg>
          </div>
        </div>
        <div class="portal-label">CONTENT ROOM</div>
        <div class="portal-sub">WATCH · EXPLORE · ENJOY CONTENT</div>
        <div class="portal-go">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
        </div>
      </button>

    </div>

    <div class="feature-bar">
      <div class="feature-item">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"/></svg>
        </div>
        <div>
          <div class="feature-title">AI-NATIVE</div>
          <div class="feature-desc">AI 기반 IP 제작</div>
        </div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
        </div>
        <div>
          <div class="feature-title">END-TO-END</div>
          <div class="feature-desc">기획부터 콘텐츠까지</div>
        </div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-4 3-6.5 6.5-6.5s6.5 2.5 6.5 6.5"/><circle cx="17.5" cy="9" r="2.6"/><path d="M15 13.2c2.7.3 4.6 2.4 5.5 4.3"/></svg>
        </div>
        <div>
          <div class="feature-title">COLLABORATE</div>
          <div class="feature-desc">함께 만드는 IP 세계</div>
        </div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 8.6c0 5-8.8 10.4-8.8 10.4S3.2 13.6 3.2 8.6a4.6 4.6 0 018.8-2 4.6 4.6 0 018.8 2z"/></svg>
        </div>
        <div>
          <div class="feature-title">OWN &amp; GROW</div>
          <div class="feature-desc">당신의 IP를 키우세요</div>
        </div>
      </div>
    </div>

  </main>
</div>
<script src="script.js"></script>
</body>
</html>
