<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thinkit(띵킷) — AI-Native IP Platform</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app landing-dark">

  <header class="site-header">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 6h14M12 6v13" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="logo-text">
        <div class="name">Thinkit</div>
        <div class="tagline">AI-NATIVE IP PLATFORM</div>
      </div>
    </div>

    <nav class="main-nav">
      <a href="create.html">DNA ROOM</a>
      <a href="open-dna.html">OPEN DNA</a>
      <a href="crew-match.html">CREW MATCH</a>
    </nav>

    <div class="header-actions">
      <button class="lp-icon-btn bearip-soon" aria-label="검색" data-soon-message="검색 기능은 아직 준비 중이에요">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <button class="dr-profile-chip">
        <span class="uname">로그인</span>
      </button>
      <button class="lp-signup-btn" onclick="if (bearipRequireLogin('create.html')) location.href='create.html'">시작하기</button>
    </div>
  </header>

  <main class="hero">
    <div class="eyebrow">AI · NATIVE · IP · PLATFORM</div>
    <h1 class="lp-wordmark">Think It<span class="bang">!</span></h1>
    <p class="lp-tagline">아이디어가 연결되고, <span class="accent">창의력이 흐르고</span>, 미래가 시작되는 곳.</p>

    <div class="lp-stage">

      <!-- Left panel: Create -->
      <button class="lp-panel left" onclick="location.href='create.html'" aria-label="창작 시작하기">
        <div class="lp-panel-head">
          <div class="t">Build It Together</div>
          <div class="s">아이디어를 함께 만들어요</div>
        </div>
        <div class="lp-workspace">
          <div class="lp-ws-top">
            <div class="lp-ws-avatars">
              <span class="thumb-2"></span><span class="thumb-4"></span><span class="thumb-6"></span>
              <span class="more">+3</span>
            </div>
          </div>
          <div class="lp-ws-ai">
            <span class="dot"></span>
            <div>
              <div class="n">AI Assistant</div>
              <div class="m">무엇을 만들어 볼까요?</div>
            </div>
          </div>
          <div class="lp-ws-row">
            <div class="lp-ws-card">
              <div class="lp-ws-card-title">Task List</div>
              <div class="lp-ws-task done">기획안 초안</div>
              <div class="lp-ws-task done">캐릭터 스케치</div>
              <div class="lp-ws-task">비주얼 가이드</div>
            </div>
            <div class="lp-ws-card">
              <div class="lp-ws-card-title">Mind Map</div>
              <div class="lp-ws-map">
                <span class="node main">IDEA</span>
                <span class="node">세계관</span>
                <span class="node">캐릭터</span>
                <span class="node">스토리</span>
              </div>
            </div>
          </div>
        </div>
      </button>

      <!-- Center: neural tree -->
      <div class="lp-tree-column">
        <svg class="lp-tree" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="lpGlow" cx="50%" cy="35%" r="60%">
              <stop offset="0" stop-color="#b98cff" stop-opacity="0.55"/>
              <stop offset="1" stop-color="#b98cff" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="lpTrunk" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#b98cff"/>
              <stop offset="0.5" stop-color="#6a3fd6"/>
              <stop offset="1" stop-color="#ff9a3c"/>
            </linearGradient>
          </defs>
          <ellipse cx="100" cy="120" rx="95" ry="95" fill="url(#lpGlow)"/>
          <path d="M100 40 C100 90 100 100 100 150" stroke="url(#lpTrunk)" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M100 70 C70 60 55 45 45 25" stroke="url(#lpTrunk)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85"/>
          <path d="M100 70 C130 60 145 45 155 25" stroke="url(#lpTrunk)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85"/>
          <path d="M100 95 C65 90 45 78 25 60" stroke="url(#lpTrunk)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.75"/>
          <path d="M100 95 C135 90 155 78 175 60" stroke="url(#lpTrunk)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.75"/>
          <path d="M100 150 C90 175 80 190 65 210" stroke="url(#lpTrunk)" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.8"/>
          <path d="M100 150 C110 175 120 190 135 210" stroke="url(#lpTrunk)" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.8"/>
          <g fill="#fff">
            <circle cx="45" cy="25" r="2.4"/>
            <circle cx="155" cy="25" r="2.4"/>
            <circle cx="25" cy="60" r="2"/>
            <circle cx="175" cy="60" r="2"/>
            <circle cx="65" cy="210" r="2.6" fill="#ff9a3c"/>
            <circle cx="135" cy="210" r="2.6" fill="#ff9a3c"/>
            <circle cx="100" cy="40" r="3.2"/>
          </g>
          <ellipse cx="100" cy="228" rx="60" ry="8" fill="#ff9a3c" opacity="0.35"/>
        </svg>
      </div>

      <!-- Right panel: Consume -->
      <button class="lp-panel right" onclick="location.href='consume.html'" aria-label="콘텐츠 즐기기">
        <div class="lp-panel-head">
          <div class="t">Imagine What's Next</div>
          <div class="s">무한한 영감을 탐험해요</div>
        </div>
        <div class="lp-content-grid">
          <div class="lp-gcard g1"><span class="tag">웹툰</span><span class="n">서울 야행수선단</span></div>
          <div class="lp-gcard g2"><span class="tag">일러스트</span><span class="n">고양이 탐정 모모</span></div>
          <div class="lp-gcard g3"><span class="tag">영상</span><span class="n">기억을 걷는 소녀</span></div>
          <div class="lp-gcard g4"><span class="tag">3D 아트</span><span class="n">별을 품은 탑</span></div>
          <div class="lp-gcard g5"><span class="tag">웹소설</span><span class="n">하늘을 걷는 소녀</span></div>
          <div class="lp-gcard g6"><span class="tag">디자인</span><span class="n">OCEAN PLANET</span></div>
        </div>
      </button>

    </div>

    <div class="lp-cta-row">
      <button class="lp-cta left" onclick="location.href='create.html'">
        <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></span>
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-4 3-6.5 6.5-6.5s6.5 2.5 6.5 6.5"/><circle cx="17.5" cy="9" r="2.6"/><path d="M15 13.2c2.7.3 4.6 2.4 5.5 4.3"/></svg></span>
        <span class="txt"><span class="t">Build It Together</span><span class="s">아이디어를 함께 만들어요</span></span>
      </button>
      <button class="lp-cta right" onclick="location.href='consume.html'">
        <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"/></svg></span>
        <span class="txt"><span class="t">Imagine What's Next</span><span class="s">무한한 영감을 탐험해요</span></span>
        <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></span>
      </button>
    </div>

  </main>
</div>
<script src="script.js"></script>
<script src="storage.js"></script>
<script src="auth-ui.js"></script>
</body>
</html>
