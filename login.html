<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6a3fd6">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thinkit">
<title>Thinkit — 로그인</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="login.css">
</head>
<body>
<div class="lg-app">
  <div class="lg-card">
    <div class="lg-logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 6h14M12 6v13" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Thinkit에 오신 걸 환영해요</h1>
    <p class="sub">닉네임과 PIN으로 시작해요.<br>처음 쓰는 닉네임이면 입력한 PIN으로 잠겨서, 다른 사람이 도용할 수 없어요.</p>

    <div class="lg-field">
      <label>닉네임</label>
      <input type="text" id="lgNickname" placeholder="예: 판타지" maxlength="20">
      <div class="error" id="lgNicknameError">닉네임을 입력해주세요.</div>
    </div>

    <div class="lg-field">
      <label>PIN (4자 이상)</label>
      <input type="password" id="lgPin" placeholder="PIN을 입력하세요" maxlength="30" autocomplete="current-password">
      <div class="error" id="lgPinError"></div>
    </div>

    <div class="lg-field" id="lgPinConfirmField" style="display:none">
      <label>PIN 확인</label>
      <input type="password" id="lgPinConfirm" placeholder="PIN을 한 번 더 입력하세요" maxlength="30" autocomplete="new-password">
      <div class="error" id="lgPinConfirmError"></div>
    </div>

    <div class="lg-field">
      <label>한 줄 소개 (선택)</label>
      <textarea id="lgBio" placeholder="어떤 창작자인지 간단히 소개해주세요"></textarea>
    </div>

    <button class="lg-submit-btn" id="lgSubmitBtn">시작하기</button>

    <div class="lg-note">
      실제 서비스가 아닌 테스트 버전이에요. PIN은 마이페이지에서 바꿀 수 있지만, 잊어버리면 직접 찾을 수 없으니 꼭 기억해두세요. 잊어버렸다면 운영자에게 문의해주세요.
    </div>

    <a class="lg-back-link" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      처음으로 돌아가기
    </a>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="firebase-init.js"></script>
<script src="storage.js"></script>
<script src="app-boot.js"></script>
<script src="login.js"></script>
</body>
</html>
